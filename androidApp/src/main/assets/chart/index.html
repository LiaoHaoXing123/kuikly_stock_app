<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:12px sans-serif;background:transparent;color:#475569}
body{display:flex;flex-direction:column}#tools{display:flex;gap:6px;overflow-x:auto;padding:3px 0 8px;flex-shrink:0}
button,select{font:12px sans-serif;border:1px solid #dce3ee;border-radius:7px;padding:8px;background:#f4f7fb;color:inherit;white-space:nowrap;min-height:34px}
#chart{flex:1;min-height:0}#status{font-size:11px;padding:7px 0;min-height:28px}#actions{display:flex;gap:6px;padding-bottom:4px}#actions button{flex:1}.dark{color:#b9c5d7}.dark button,.dark select{background:#232d3c;border-color:#39465a}
#quote{flex-shrink:0;padding:5px 10px;margin-bottom:4px;border-radius:8px;background:#f4f7fb;line-height:20px;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:scroll;overflow-y:hidden;scrollbar-width:none}
#quote::-webkit-scrollbar{display:none}
#quoteDate{color:#64748b;margin-right:8px}#quoteValues{display:inline}.qv{margin-right:9px}.dark #quote{background:#232d3c}.dark #quoteDate{color:#a6b4c8}
</style></head><body>
<div id="tools"><select id="indicator" aria-label="副图指标"><option>VOL</option><option>MACD</option><option>KDJ</option><option>RSI</option></select><button onclick="draw('segment')">趋势线</button><button onclick="draw('horizontalStraightLine')">水平线</button><button onclick="draw('fibonacciLine')">斐波那契</button><button onclick="chart.removeOverlay();statusText('画线已清除')">清除画线</button><button onclick="chart.scrollToRealTime()">最新</button></div>
<div id="quote"><div id="quoteDate">行情信息</div><div id="quoteValues"></div></div>
<div id="chart"></div><div id="status">长按查看蜡烛 · 双指缩放 · 横拖平移</div>
<div id="actions"><button onclick="markStart()">设为区间起点</button><button onclick="askRange()">解读区间</button><button onclick="askCandle()">解读此根</button></div>
<script>/* ENGINE_BUNDLE */</script><script>
let chart=null, rows=[],selected=-1,start=-1,pane=null,key='',focus=-1,highlight=0;
const statusText=t=>document.getElementById('status').textContent=t;
const fmtNum=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtVol=v=>v>=1e8?(v/1e8).toFixed(2)+'亿':v>=1e4?(v/1e4).toFixed(1)+'万':String(v);
function showQuote(index){const b=rows[index];if(!b)return;document.getElementById('quoteDate').textContent=b.date+' · '+(index===rows.length-1?'最新':'选中');const box=document.getElementById('quoteValues');box.replaceChildren();[['开',b.open],['高',b.high],['低',b.low],['收',b.close],['量',b.volume]].forEach(([label,val])=>{const span=document.createElement('span');span.className='qv';span.textContent=label+' '+(label==='量'?fmtVol(val):fmtNum(val));box.appendChild(span);});}
function draw(name){chart.createOverlay({name});statusText('在图表上选择画线锚点');}
function markStart(){if(selected<0)return statusText('请先长按选择一根蜡烛');start=selected;statusText('区间起点 '+rows[start].date+'，请选择终点');}
function send(kind,from,to){const v=chart.getVisibleRange();ChartBridge.selection(JSON.stringify({kind,from,to,visibleFrom:Math.max(0,Math.floor(v.from)),visibleTo:Math.min(rows.length,Math.ceil(v.to)),indicator:document.getElementById('indicator').value}));}
function askCandle(){if(selected<0)return statusText('请先长按选择一根蜡烛');send('ask',selected,selected);}
function askRange(){if(start<0||selected<0||start===selected)return statusText('先设起点，再长按选择另一根作为终点');send('range',Math.min(start,selected),Math.max(start,selected));}
document.getElementById('indicator').onchange=e=>{if(pane)chart.removeIndicator(pane);pane=chart.createIndicator(e.target.value,false,{height:120,gap:{top:58,bottom:12}});};
window.renderChart=function(p){try{
 document.body.classList.toggle('dark',!!p.dark);
 if(!chart){chart=klinecharts.init('chart',{locale:'zh-CN',timezone:'Asia/Shanghai'});chart.createIndicator('MA',false,{id:'candle_pane',gap:{top:70,bottom:28}});pane=chart.createIndicator('VOL',false,{height:120,gap:{top:58,bottom:12}});
 chart.subscribeAction('onCrosshairChange',e=>{if(e.dataIndex>=0&&e.dataIndex<rows.length){selected=e.dataIndex;showQuote(selected);statusText(rows[selected].date+(start>=0?' · 起点 '+rows[start].date:''));}});
 new ResizeObserver(()=>chart.resize()).observe(document.getElementById('chart'));}
 chart.setStyles(p.dark?'dark':'light');
 chart.setStyles({candle:{tooltip:{showRule:'none'},bar:{upColor:'#e65054',downColor:'#16a079',upBorderColor:'#e65054',downBorderColor:'#16a079',upWickColor:'#e65054',downWickColor:'#16a079'}},indicator:{tooltip:{text:{size:10,marginTop:3,marginBottom:3,marginLeft:4,marginRight:6}}},yAxis:{tickText:{size:10}},xAxis:{tickText:{size:10}}});
 const nextKey=JSON.stringify([p.code,p.period,p.bars]);
 if(nextKey!==key){key=nextKey;rows=p.bars||[];selected=-1;start=-1;focus=-1;highlight=0;chart.removeOverlay();chart.applyNewData(rows.map(b=>({...b,timestamp:Date.parse(b.date+'T00:00:00+08:00')})));statusText('本地行情截至 '+(rows.at(-1)?.date||'未知')+' · 长按选点');}
 if(p.focus>=0&&p.focus<rows.length&&p.focus!==focus){focus=p.focus;selected=focus;chart.scrollToDataIndex(focus);chart.removeOverlay({id:'evidence'});chart.createOverlay({id:'evidence',name:'verticalStraightLine',lock:true,points:[{dataIndex:focus}]});}
 if(p.highlight!==highlight){highlight=p.highlight;chart.removeOverlay({id:'ai-price'});if(highlight>0)chart.createOverlay({id:'ai-price',name:'horizontalStraightLine',lock:true,points:[{value:highlight}]});}
 showQuote(selected>=0?selected:rows.length-1);chart.resize();
 }catch(e){statusText('图表加载失败，请切换基础图表');console.error(e.stack||String(e));}}
</script></body></html>
