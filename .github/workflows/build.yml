name: Build (Android + iOS)

on:
  push:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android assembleDebug + JS compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle distribution fallback
        run: |
          if ! curl -sI -m 15 https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip | head -n 1 | grep -q 200; then
            sed -i.bak 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties
            rm -f gradle/wrapper/gradle-wrapper.properties.bak
            echo "Tencent Gradle mirror unreachable, fell back to services.gradle.org"
          fi

      - name: Maven mirror fallback (Kuikly deps)
        run: |
          if ! curl -sI -m 20 https://mirrors.tencent.com/repository/maven-tencent/ | head -n 1 | grep -qE '200|301|302'; then
            echo "Tencent maven mirror unreachable, applying ghproxy proxy..."
            sed -i 's|https://mirrors.tencent.com/|https://ghproxy.com/https://mirrors.tencent.com/|g' settings.gradle.kts build.gradle.kts
            echo "Maven mirror proxied via ghproxy"
          else
            echo "Tencent maven mirror reachable"
          fi
          cat >> gradle.properties << 'PROPEOF'
          systemProp.http.connectionTimeout=120000
          systemProp.http.socketTimeout=120000
          org.gradle.internal.http.connectionTimeout=120000
          org.gradle.internal.http.socketTimeout=120000
          PROPEOF

      - name: Build
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug :shared:compileKotlinJs --stacktrace --console=plain 2>&1 | tee build-android.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e:|error:|FAILED|Execution failed|What went wrong|Caused by" build-android.log | head -n 30 | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Upload full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-android
          path: build-android.log

  data-assets:
    name: Built-in JSON assets consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run built-in asset consistency tests
        run: python data-pipeline/test_export_common_assets.py

  ios:
    name: iOS Kotlin + Xcode build
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle distribution fallback
        run: |
          if ! curl -sI -m 15 https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip | head -n 1 | grep -q 200; then
            sed -i.bak 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' gradle/wrapper/gradle-wrapper.properties
            rm -f gradle/wrapper/gradle-wrapper.properties.bak
            echo "Tencent Gradle mirror unreachable, fell back to services.gradle.org"
          fi

      - name: Maven mirror fallback (Kuikly deps)
        run: |
          if ! curl -sI -m 20 https://mirrors.tencent.com/repository/maven-tencent/ | head -n 1 | grep -qE '200|301|302'; then
            echo "Tencent maven mirror unreachable, applying ghproxy proxy..."
            sed -i 's|https://mirrors.tencent.com/|https://ghproxy.com/https://mirrors.tencent.com/|g' settings.gradle.kts build.gradle.kts
            echo "Maven mirror proxied via ghproxy"
          else
            echo "Tencent maven mirror reachable"
          fi
          cat >> gradle.properties << 'PROPEOF'
          systemProp.http.connectionTimeout=120000
          systemProp.http.socketTimeout=120000
          org.gradle.internal.http.connectionTimeout=120000
          org.gradle.internal.http.socketTimeout=120000
          PROPEOF

      - name: Compile shared for iOS targets
        run: |
          set -o pipefail
          ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosX64 --stacktrace --console=plain 2>&1 | tee build-ios.log

      - name: Generate dummy framework for CocoaPods
        run: |
          set -o pipefail
          ./gradlew :shared:generateDummyFramework --stacktrace --console=plain 2>&1 | tee -a build-ios.log
          echo "=== verify framework path ==="
          ls -la shared/build/cocoapods/framework/ 2>&1 || true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: iosApp/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('iosApp/Podfile') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Pod diagnostics
        run: |
          echo "=== pod version ==="; pod --version
          echo "=== pod repo list ==="; pod repo list
          echo "=== iosApp dir before install ==="; ls -la iosApp/
          echo "=== Podfile ==="; cat iosApp/Podfile
          # 清理放错位置的 workspace 文件（pod install 会重新生成正确的）
          rm -f iosApp/contents.xcworkspacedata
          rm -rf iosApp/iosApp.xcworkspace iosApp/Pods

      - name: Pod install
        run: |
          set -o pipefail
          (cd iosApp && pod install --verbose) 2>&1 | tee -a build-ios.log

      - name: Xcode build (simulator, no signing)
        run: |
          set -o pipefail
          (cd iosApp && xcodebuild -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO) 2>&1 | tee -a build-ios.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e:|error:|FAILED|Execution failed|What went wrong|Caused by|error " build-ios.log | head -n 30 | while IFS= read -r line; do echo "::error::$line"; done || true

      - name: Upload full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-ios
          path: build-ios.log
