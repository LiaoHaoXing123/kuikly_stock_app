name: Daily stock data build (AkShare -> SQLite stock.db)

# 每天 07:30 UTC（= 北京 15:30，A股收盘后）的周一~周五运行，构建最新行情库并发布到
# GitHub Release 滚动 tag "data-latest"。非交易日拉到的 latest_trade_date 仍是上一交易日，
# App 据此判断无更新而跳过，自愈。
on:
  schedule:
    # 每天 08:30 UTC = 北京 16:30（收盘后留足数据回落时间，确保取到当日收盘）
    - cron: '30 8 * * 1-5'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-data-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/requirements.txt

      - name: Build stock.db + version.json
        run: python data-pipeline/build_stock_db.py

      - name: Publish to GitHub Release (data-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd data-pipeline
          if gh release view data-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release data-latest 已存在 -> 用 --clobber 覆盖 assets"
            gh release upload data-latest stock.db version.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "创建 Release data-latest"
            gh release create data-latest --repo "$GITHUB_REPOSITORY" \
              --title "行情数据" \
              --notes "App 自动更新的行情 SQLite 库（stock.db + version.json）" \
              stock.db version.json
          fi

      - name: Publish to cdn branch (Render 静态站点兜底)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mkdir -p /tmp/publish
          cp data-pipeline/stock.db data-pipeline/version.json /tmp/publish/
          # 孤立分支 cdn：仅含最新 stock.db + version.json（force push，避免历史膨胀）
          git checkout --orphan cdn
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 -not -name ".git" -exec rm -rf {} +
          cp /tmp/publish/stock.db /tmp/publish/version.json .
          git add -f stock.db version.json
          git commit -m "data update $(date -u +%FT%TZ)" || echo "no change"
          git push --force origin cdn
